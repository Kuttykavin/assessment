<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAP FSM | Field Service Management Enterprise Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="app">
    <!-- Top Bar & Navigation -->
    <header class="app-header shadow-sm">
      <nav class="navbar navbar-expand-lg navbar-dark bg-navy">
        <div class="container-fluid px-4">
          <a class="navbar-brand d-flex align-items-center gap-2" href="#" onclick="loadPage('dashboard')">
            <div class="brand-icon">
              <i class="bi bi-gear-wide-connected"></i>
            </div>
            <div>
              <span class="brand-title">SAP FSM</span>
              <span class="brand-subtitle">Greenford Utilities</span>
            </div>
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto ms-lg-4" id="mainNav">
              <!-- Dynamically populated based on login and roles -->
            </ul>
            <div class="d-flex align-items-center gap-3 ms-auto" id="userControls">
              <!-- Sync indicator -->
              <div class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 d-none d-md-flex align-items-center gap-2">
                <span class="pulse-indicator"></span> SAP S/4HANA Connected
              </div>
              <!-- Notification button -->
              <div class="dropdown">
                <button class="btn btn-outline-light position-relative rounded-pill px-3 py-1 btn-sm" id="notifDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                  <i class="bi bi-bell-fill"></i>
                  <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="notifBadge">0</span>
                </button>
                <div class="dropdown-menu dropdown-menu-end shadow-lg p-0 notif-dropdown-menu" aria-labelledby="notifDropdown">
                  <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-light rounded-top">
                    <h6 class="m-0 fw-bold">Notifications</h6>
                    <button class="btn btn-sm btn-link text-decoration-none p-0" onclick="markAllNotificationsRead()">Mark all read</button>
                  </div>
                  <div id="notificationList" class="notif-list-container">
                    <p class="text-muted text-center py-3 m-0 small">No notifications</p>
                  </div>
                </div>
              </div>
              <!-- User Profile Menu -->
              <div class="dropdown" id="userMenuWrapper">
                <!-- User dropdown inserted here -->
              </div>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <!-- Main Container -->
    <main class="container-fluid px-4 py-4">
      <div id="content">
        <!-- Dynamic views will render here -->
      </div>
    </main>
  </div>

  <!-- Login Modal -->
  <div class="modal fade" id="loginModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content login-modal-card border-0 shadow-lg">
        <div class="modal-header bg-navy text-white border-0 py-4 px-4">
          <div class="d-flex align-items-center gap-3">
            <div class="brand-icon-lg">
              <i class="bi bi-shield-lock-fill"></i>
            </div>
            <div>
              <h5 class="modal-title fw-bold m-0">SAP Field Service Management</h5>
              <small class="text-white-50">Enterprise Portal • Single Sign-On</small>
            </div>
          </div>
        </div>
        <div class="modal-body p-4">
          <form id="loginForm">
            <div class="alert alert-info py-2 small mb-3">
              <i class="bi bi-info-circle me-1"></i> Demo credentials: <strong>admin</strong> / <strong>admin123</strong>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold text-muted text-uppercase">Username or Email</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="loginUsername" value="admin" required placeholder="Enter username">
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label small fw-semibold text-muted text-uppercase">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control" id="loginPassword" value="admin123" required placeholder="Enter password">
              </div>
            </div>
            <div class="alert alert-danger d-none py-2 small" id="loginError"></div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold d-flex justify-content-center align-items-center gap-2">
              <i class="bi bi-box-arrow-in-right"></i> Sign In to Service Portal
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Order Details Modal -->
  <div class="modal fade" id="orderDetailsModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-navy text-white">
          <h5 class="modal-title fw-bold" id="orderModalTitle">Service Order Details</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4" id="orderDetailsContent">
          <!-- Populated dynamically -->
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Create Order Modal -->
  <div class="modal fade" id="createOrderModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-navy text-white">
          <h5 class="modal-title fw-bold"><i class="bi bi-plus-circle me-2"></i>Create New Service Order</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="createOrderForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Order Number</label>
                <input type="text" class="form-control" id="newOrderNumber" placeholder="e.g. SO-2026-007" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Company Code</label>
                <select class="form-select" id="newOrderCompany">
                  <option value="GU01">GU01 - Greenford Utilities Main</option>
                  <option value="GU02">GU02 - Greenford Utilities East</option>
                  <option value="GU03">GU03 - Greenford Utilities West</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold small">Plant</label>
                <select class="form-select" id="newOrderPlant">
                  <option value="P001">P001 - Main Campus</option>
                  <option value="P002">P002 - East Campus</option>
                  <option value="P003">P003 - West Campus</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold small">Region</label>
                <select class="form-select" id="newOrderRegion">
                  <option value="Region 1">Region 1</option>
                  <option value="Region 2">Region 2</option>
                  <option value="Region 3">Region 3</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold small">Transaction Type</label>
                <select class="form-select" id="newOrderType">
                  <option value="IN01">IN01 (Internal Service)</option>
                  <option value="IN02">IN02 (External Service)</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Customer Name</label>
                <input type="text" class="form-control" id="newOrderCustomer" placeholder="Customer name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Priority</label>
                <select class="form-select" id="newOrderPriority">
                  <option value="low">Low</option>
                  <option value="medium" selected>Medium</option>
                  <option value="high">High</option>
                  <option value="critical">Critical</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Estimated Cost (£)</label>
                <input type="number" step="0.01" class="form-control" id="newOrderCost" placeholder="10000.00" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Due Date</label>
                <input type="date" class="form-control" id="newOrderDueDate" required>
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold small">Description</label>
                <textarea class="form-control" id="newOrderDesc" rows="3" placeholder="Detailed service description and scope" required></textarea>
              </div>
            </div>
            <div class="mt-4 d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary fw-semibold"><i class="bi bi-check-lg me-1"></i>Create Service Order</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Exception Details Modal -->
  <div class="modal fade" id="exceptionModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-navy text-white">
          <h5 class="modal-title fw-bold" id="exceptionModalTitle">Exception Resolution Center</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4" id="exceptionModalContent">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
